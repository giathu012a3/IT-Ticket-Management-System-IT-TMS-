{% extends "base.html" %}

{% block title %}Đánh giá dịch vụ - TicketSys{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div
        class="bg-white dark:bg-[#111418] rounded-2xl shadow-xl border border-slate-200 dark:border-[#3b4754] overflow-hidden">
        <div class="bg-emerald-600 p-8 text-center">
            <div
                class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                <span class="material-symbols-outlined text-white text-3xl">sentiment_satisfied</span>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Yêu cầu đã được giải quyết!</h1>
            <p class="text-emerald-100">Chúng tôi rất mong nhận được đánh giá từ bạn.</p>
        </div>

        <form method="POST" class="p-8 space-y-8">
            <div class="text-center">
                <p class="text-slate-500 dark:text-slate-400 mb-4 font-medium">Bạn đánh giá thế nào về việc hỗ trợ cho
                    yêu cầu:</p>
                <div
                    class="bg-slate-50 dark:bg-[#283039] rounded-lg p-3 inline-block border border-slate-100 dark:border-slate-700 mb-6">
                    <span class="font-bold text-slate-800 dark:text-white">{{ ticket.title }}</span>
                </div>

                <style>
                    .star-rating {
                        display: flex;
                        flex-direction: row-reverse;
                        justify-content: center;
                        gap: 0.5rem;
                    }
                    .star-rating input {
                        display: none;
                    }
                    .star-rating label {
                        color: #cbd5e1; /* slate-300 */
                        cursor: pointer;
                        transition: color 0.2s;
                    }
                    /* For dark mode */
                    .dark .star-rating label {
                        color: #475569; /* slate-600 */
                    }
                    
                    .star-rating label:hover,
                    .star-rating label:hover ~ label,
                    .star-rating input:checked ~ label {
                        color: #fbbf24 !important; /* amber-400 */
                    }
                </style>
                <div class="star-rating">
                    <input type="radio" name="rating" value="5" id="star5" required>
                    <label for="star5">
                        <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
                    </label>

                    <input type="radio" name="rating" value="4" id="star4">
                    <label for="star4">
                        <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
                    </label>

                    <input type="radio" name="rating" value="3" id="star3">
                    <label for="star3">
                        <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
                    </label>

                    <input type="radio" name="rating" value="2" id="star2">
                    <label for="star2">
                        <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
                    </label>

                    <input type="radio" name="rating" value="1" id="star1">
                    <label for="star1">
                        <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Ý kiến đóng góp (Tùy
                    chọn)</label>
                <textarea name="comment" rows="4"
                    class="w-full rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-[#283039] focus:bg-white dark:focus:bg-[#283039] text-slate-900 dark:text-white focus:border-emerald-500 focus:ring-emerald-500 transition-colors p-4 block text-sm"
                    placeholder="Hãy cho chúng tôi biết bạn hài lòng về điều gì..."></textarea>
            </div>

            <div class="flex items-center justify-between pt-4">
                <button type="submit" formaction="{{ url_for('user.skip_ticket_feedback', ticket_id=ticket.id) }}"
                    class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold px-6 py-3 rounded-lg transition-colors">
                    Đóng, bỏ qua đánh giá
                </button>
                <button type="submit"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-lg shadow-lg shadow-emerald-500/20 transition-transform active:scale-95">
                    Gửi đánh giá
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
